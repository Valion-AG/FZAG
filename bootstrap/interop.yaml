apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fzag-brokers
  namespace: argocd
spec:
  project: fzag-brokers
  source:
    repoURL: https://github.com/Valion-AG/FZAG
    targetRevision: main
    path: workloads/interop
  destination:
    server: https://kubernetes.default.svc
    namespace: interop
  # Adopted after live diff and protocol validation; keep data out of pruning.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - RespectIgnoreDifferences=true
