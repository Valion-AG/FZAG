apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fzag-runtime
  namespace: {{ .Release.Namespace }}
spec:
  description: Runtime Fabric installer; trusted infrastructure repository only
  sourceRepos:
    - {{ .Values.repository | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fzag-{{ .Values.site }}-runtime
  namespace: {{ .Release.Namespace }}
spec:
  project: fzag-runtime
  source:
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: {{ .Values.path | quote }}
    plugin:
      name: fzag-rtf-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: rtf
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
