{{- if lt (int .Values.replicas) 1 }}{{ fail "replicas must be at least 1" }}{{ end }}
apiVersion: v1
kind: Namespace
metadata:
  name: fzag-k8s-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-page
  namespace: fzag-k8s-demo
data:
  index.html: |
    <!doctype html><html lang="en"><title>FZAG Kubernetes GitOps demo</title>
    <h1>FZAG Kubernetes GitOps demo</h1>
    <p>This is a lightweight test workload, not MuleSoft Runtime Fabric.</p></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: fzag-k8s-demo
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: fzag-gitops-demo
  template:
    metadata:
      labels:
        app: fzag-gitops-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ .Values.image | quote }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
{{ .Values.resources | toYaml | indent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: demo-page
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-demo
  namespace: fzag-k8s-demo
spec:
  type: ClusterIP
  selector:
    app: fzag-gitops-demo
  ports:
    - port: 80
      targetPort: http
